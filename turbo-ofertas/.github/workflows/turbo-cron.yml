name: Turbo Ofertas Cron

# Agendador das automações via GitHub Actions (gratuito).
# Bate nos endpoints /api/cron/* do app no Render, nos horários da §9.
# Horários em UTC (Brasil = UTC-3).
on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 BRT — seleção + criativos + pacote
    - cron: "0 12 * * *"   # 09:00 BRT — publish post 1
    - cron: "30 15 * * *"  # 12:30 BRT — publish post 2
    - cron: "0 23 * * *"   # 20:00 BRT — publish post 3
    - cron: "0 21 * * 5"   # sex 18:00 BRT — relatório semanal
    - cron: "0 11 * * 0"   # dom 08:00 BRT — lembrete de links
  workflow_dispatch:
    inputs:
      task:
        description: "Tarefa a rodar manualmente (daily/publish1/publish2/publish3/weekly/links)"
        default: daily

env:
  APP_URL: https://turbo-ofertas.onrender.com

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar tarefa
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            "0 9 * * *")   echo "task=daily"    >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *")  echo "task=publish1" >> "$GITHUB_OUTPUT" ;;
            "30 15 * * *") echo "task=publish2" >> "$GITHUB_OUTPUT" ;;
            "0 23 * * *")  echo "task=publish3" >> "$GITHUB_OUTPUT" ;;
            "0 21 * * 5")  echo "task=weekly"   >> "$GITHUB_OUTPUT" ;;
            "0 11 * * 0")  echo "task=links"    >> "$GITHUB_OUTPUT" ;;
            *)             echo "task=${{ github.event.inputs.task || 'daily' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Acionar endpoint de cron
        run: |
          TASK="${{ steps.t.outputs.task }}"
          echo "Rodando task: $TASK"
          curl -fsS -X POST "$APP_URL/api/cron/$TASK?token=${{ secrets.CRON_SECRET }}" -w "\nHTTP %{http_code}\n"
