# Render Blueprint — Turbo Ofertas
services:
  - type: web
    name: turbo-ofertas
    runtime: node
    plan: starter # necessário para disco persistente
    buildCommand: npm install && npm run build
    # prisma e tsx são dependencies (o Render mantém no runtime). 'npx --yes' nunca
    # abre prompt interativo (era o que travava o deploy por 15 min). '-p $PORT' fixa a porta.
    startCommand: npx --yes prisma db push --skip-generate ; node --import tsx prisma/seed.ts ; node --import tsx scripts/bootstrap-select.ts ; npx --yes next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /ofertas
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460" # GC agressivo abaixo do limite de 512MB do Starter
      - key: ENABLE_VIDEO
        value: "0" # vídeo (ffmpeg) desligado por memória; ligue com "1" em plano >=2GB
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GROUP_INVITE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_PRIVATE_CHAT_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
