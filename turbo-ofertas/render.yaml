# Render Blueprint — Turbo Ofertas
services:
  - type: web
    name: turbo-ofertas
    runtime: node
    plan: starter # necessário para disco persistente
    buildCommand: npm install --include=dev && npm run build
    # Runtime (disco montado): cria/atualiza o schema no disco, popula o admin+dados,
    # e sobe o Next com BIND EXPLÍCITO na porta do Render (corrige o health check timeout).
    startCommand: npx prisma db push --skip-generate && node --import tsx prisma/seed.ts && npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /ofertas
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/app.db # disco persistente
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GROUP_INVITE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_PRIVATE_CHAT_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
