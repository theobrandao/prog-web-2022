# Render Blueprint — Turbo Ofertas
# Um serviço web (Next.js) com disco persistente para o SQLite.
services:
  - type: web
    name: turbo-ofertas
    runtime: node
    plan: starter # necessário para disco persistente e preDeploy
    buildCommand: npm install --include=dev && npm run build
    # migrações + bootstrap do admin rodam ANTES de subir o servidor (não atrasam o health check)
    preDeployCommand: npx prisma db push --skip-generate && node --import tsx prisma/seed.ts
    startCommand: npm run start
    healthCheckPath: /ofertas
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/app.db # aponta para o disco persistente
      - key: SESSION_SECRET
        generateValue: true # o Render gera uma chave forte automaticamente
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # preencher com a URL do Render após o 1º deploy (habilita o Instagram)
      - key: GROUP_INVITE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_PRIVATE_CHAT_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
